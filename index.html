<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Sticky Notes</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>

<body>

    <nav class="nav">
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="#" id="logoutBtn">Logout</a></li>
        </ul>
    </nav>

    <header class="header">
        <h1>My Sticky Notes</h1>
    </header>

    <div class="actions">
        <button id="newNoteBtn">
            New Note
        </button>
        <input 
            type="text" 
            placeholder="Search notes..." 
            id="search"
        >
    </div>

    <div class="note-form" id="noteForm">
        <h2>New Note</h2>
        <input 
            id="noteTitle" 
            type="text" 
            placeholder="Note title"
        >
        <textarea 
            id="noteContent" 
            placeholder="Write your note..."
        ></textarea>
        <select id="noteColor">
            <option value="yellow">Yellow 🟨</option>
            <option value="pink">Pink 🩷</option>
            <option value="blue">Blue 🟦</option>
            <option value="green">Green 🟩</option>
        </select>
        <div class="form-buttons">
            <button id="saveNoteBtn">💾 Save</button>
            <button id="closeBtn">❌ Cancel</button>
        </div>
    </div>

    <div class="container">
        <div class="grid" id="notesGrid">
            <!-- Your JavaScript will dynamically insert .card elements here -->
        </div>
    </div>

    <footer class="footer">
        <p>© 2026 My Sticky Notes. All rights reserved by Taher Abubaker.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="script.js"></script>
</body>
</html>
